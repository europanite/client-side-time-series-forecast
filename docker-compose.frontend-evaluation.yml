# Run with: docker compose -f docker-compose.yml -f docker-compose.frontend-evaluation.yml \
#   up --build --abort-on-container-exit --exit-code-from frontend_stock_eval
services:
  frontend:
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
  frontend_stock_eval:
    build:
      context: .
      dockerfile: eval/Dockerfile
    depends_on:
      - frontend
    working_dir: /repo
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      EVAL_REPO_ROOT: /repo
      EVAL_APP_URL: http://frontend:5173/client-side-time-series-forecast-ai/
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ./:/repo
    shm_size: 1gb
    restart: 'no'
