services:
  lightgbm_air_passengers_benchmark:
    profiles:
      - benchmark
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: lightgbm_air_passengers_benchmark
    working_dir: /repo
    volumes:
      - ./:/repo
      - /repo/frontend/app/node_modules
    command: >-
      sh -lc "npm --prefix frontend/app ci && node scripts/benchmark-air-passengers-fair.mjs --algorithm lightgbm --markdown"

  air_passengers_fair_benchmark:
    profiles:
      - benchmark
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: air_passengers_fair_benchmark
    working_dir: /repo
    volumes:
      - ./:/repo
      - /repo/frontend/app/node_modules
    command: >-
      sh -lc "npm --prefix frontend/app ci && node scripts/benchmark-air-passengers-fair.mjs"

  frontend_test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: frontend_test
    working_dir: /app
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./reports/frontend:/reports/frontend
    command: >-
      sh -lc "npm ci && npm test -- --ci --runInBand --verbose"
